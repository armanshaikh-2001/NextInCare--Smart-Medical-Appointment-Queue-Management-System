<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Queue - NextInCare</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mode">
    <header>
        <div class="logo-container">
            <img src="assets/logo.svg" alt="NextInCare Logo" class="logo">
            <h1>NextInCare</h1>
        </div>
        <div class="header-controls">
            <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
    </header>

    <main class="queue-container">
        <div class="queue-header">
            <h2><i class="fas fa-tv"></i> Live Queue Board</h2>
            <div class="queue-refresh">
                <span id="last-updated">Last updated: Just now</span>
                <button id="refresh-queue" class="btn-icon" aria-label="Refresh queue">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
        
        <div class="queue-status">
            <div class="queue-current">
                <h3><i class="fas fa-user-md"></i> Now Serving</h3>
                <div id="current-patient" class="patient-card">
                    <div class="patient-info">
                        <span class="patient-name">No current appointment</span>
                        <span class="patient-service"></span>
                    </div>
                    <div class="patient-time">
                        <span class="patient-time"></span>
                    </div>
                </div>
            </div>
            
            <div class="queue-upcoming">
                <h3><i class="fas fa-clock"></i> Up Next</h3>
                <div id="upcoming-patients" class="upcoming-list">
                    <div class="empty-queue">
                        <i class="fas fa-procedures"></i>
                        <p>No upcoming appointments</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="queue-actions">
            <button id="on-my-way" class="btn btn-primary">
                <i class="fas fa-walking"></i> On My Way
            </button>
            <button id="view-all" class="btn btn-secondary">
                <i class="fas fa-list"></i> View All Appointments
            </button>
        </div>
    </main>

    <div id="all-appointments-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>All Appointments</h3>
                <button id="close-appointments" class="btn-icon">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="appointments-filter">
                    <select id="filter-status">
                        <option value="all">All Statuses</option>
                        <option value="waiting">Waiting</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                    <input type="text" id="search-patient" placeholder="Search patient...">
                </div>
                
                <div class="appointments-list-container">
                    <table id="appointments-list">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Patient</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Filled by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/db.js" type="module"></script>
    <script src="js/ui.js" type="module"></script>
    <script src="js/queue.js" type="module"></script>
</body>
</html>
